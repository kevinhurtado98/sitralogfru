name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen de la app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Construir y publicar imagen de schema/seed
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}:migrate
          cache-from: |
            type=gha,scope=app
            type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Desplegar en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          REMOTE_ENV="IMAGE=$(printf '%q' "$IMAGE") DB_PASSWORD=$(printf '%q' "$DB_PASSWORD")"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "$REMOTE_ENV bash -s" <<'REMOTE_SCRIPT'
          set -e

          ENV_FILE=/opt/docker-envs/sitralogfru/.env
          DB_NAME=$(grep -E '^DB_NAME=' $ENV_FILE | cut -d= -f2 | tr -d '"\r')
          DB_NAME=${DB_NAME:-sitralogfru}

          # 1. Descargar imágenes nuevas antes de tocar nada (menos downtime)
          docker pull $IMAGE:latest
          docker pull $IMAGE:migrate

          # 2. Si la BD no existe: crearla y marcar que corra el seed.
          #    Si ya existe: se conserva tal cual, sin seed.
          DB_EXISTS=$(docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U SA -P "$DB_PASSWORD" -C -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = '$DB_NAME'" | tr -d '[:space:]')

          if [ "$DB_EXISTS" = "0" ]; then
            echo ">> BD '$DB_NAME' no existe: se crea y se ejecutará el seed"
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U SA -P "$DB_PASSWORD" -C \
              -Q "CREATE DATABASE [$DB_NAME]"
            RUN_SEED=1
          else
            echo ">> BD '$DB_NAME' existente: se conservan los datos (sin seed)"
            RUN_SEED=0
          fi

          # 3. Sincronizar schema (idempotente; falla si un cambio implica
          #    pérdida de datos, en cuyo caso se resuelve manualmente)
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            --env-file $ENV_FILE \
            -e RUN_SEED=$RUN_SEED \
            $IMAGE:migrate

          # 4. Reemplazar el contenedor de la app
          docker stop sitralogfru || true
          docker rm   sitralogfru || true
          docker run -d \
            --name sitralogfru \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            --env-file $ENV_FILE \
            -p 3000:3000 \
            $IMAGE:latest

          # 5. Limpiar imágenes huérfanas de deploys anteriores
          docker image prune -f
          REMOTE_SCRIPT
