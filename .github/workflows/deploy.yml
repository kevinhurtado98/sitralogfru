name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Resetear base de datos y migrar schema
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     1433
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME:     sitralogfru
        run: |
          # Recrear la BD limpia via SSH
          ssh -o StrictHostKeyChecking=no \
              -i <(echo "${{ secrets.VPS_SSH_KEY }}") \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "docker stop sitralogfru || true && \
               docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U SA -P '${{ secrets.DB_PASSWORD }}' -C \
                 -Q \"USE master; ALTER DATABASE sitralogfru SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE sitralogfru; CREATE DATABASE sitralogfru\""

          # Aplicar schema
          pnpm db:push

          # Seed datos iniciales
          pnpm db:seed

      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest

            docker rm sitralogfru || true

            docker run -d \
              --name sitralogfru \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              --env-file /opt/docker-envs/sitralogfru/.env \
              -p 3000:3000 \
              ${{ env.IMAGE }}:latest
