name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen de la app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Construir y publicar imagen de migraciones
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: ${{ env.IMAGE }}:migrate

      - name: Desplegar en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Detener contenedor anterior
            docker stop sitralogfru || true
            docker rm   sitralogfru || true

            # 2. Resetear BD (etapa de desarrollo)
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U SA -P '${{ secrets.DB_PASSWORD }}' -C \
              -Q "IF EXISTS (SELECT 1 FROM sys.databases WHERE name = 'sitralogfru') \
                    BEGIN \
                      ALTER DATABASE sitralogfru SET SINGLE_USER WITH ROLLBACK IMMEDIATE; \
                      DROP DATABASE sitralogfru; \
                    END; \
                  CREATE DATABASE sitralogfru"

            # 3. Aplicar schema y seed con imagen dedicada
            docker pull ${{ env.IMAGE }}:migrate
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              --env-file /opt/docker-envs/sitralogfru/.env \
              ${{ env.IMAGE }}:migrate

            # 4. Arrancar la app
            docker pull ${{ env.IMAGE }}:latest
            docker run -d \
              --name sitralogfru \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              --env-file /opt/docker-envs/sitralogfru/.env \
              -p 3000:3000 \
              ${{ env.IMAGE }}:latest
